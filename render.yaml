services:
  - type: web
    name: trazia-rfid
    env: python
    rootDir: inventario_rfid
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: SECURITY_PASSWORD_SALT
        generateValue: true
      - key: GPT4ALL_ENABLED
        value: false
      - key: MAIL_ENABLED
        value: false
      - key: REQUIRE_EMAIL_VERIFICATION
        value: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: trazia-rfid-db
          property: connectionString

databases:
  - name: trazia-rfid-db
